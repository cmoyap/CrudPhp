services:
  # Servidor web con PHP
  php:
    build: .                          # ← Cambiado: construye desde el Dockerfile
    container_name: uni_php
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres

  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: uni_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: uniandes
      POSTGRES_DB: deber_1
    ports:
      - "3254:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: